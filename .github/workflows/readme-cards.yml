name: generate readme cards

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: heyludy
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # fail_on_error stops a rate-limited run from publishing a "Something went
      # wrong" card over the good one — the previous dist stays live instead.
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=heyludy&show_icons=true&theme=tokyonight&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          # exclude_repo drops class assignments and scratch repos: they are
          # byte-count noise, not work worth ranking languages by.
          options: username=heyludy&layout=compact&theme=tokyonight&hide_border=true&exclude_repo=SWE_2021_41_2024_2_week2,SWE_2021_41_2024_2_week_4,SWE_2021_41_2024_2_week_7,SWE_2021_41_2024_2_week_9,SWE_2021_41_2024_2_week_10,24-2-Courses,Obsidian,Comedunion
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
